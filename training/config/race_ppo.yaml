# Fase 2 — política del piloto (un solo agente).
# PPO, red MLP pequeña, observaciones vectoriales (raycasts + estado + canales de
# directiva). CPU-only: la GPU no aporta con este setup (CLAUDE.md §2.3).
#
#   mlagents-learn training/config/race_ppo.yaml `
#     --env=unity/Builds/train-windows/train.exe --num-envs=4 --run-id=race08
#
# El nombre "RaceAgent" tiene que coincidir con BehaviorParameters.BehaviorName
# (ver TrainingArena.AddBehaviour).
#
# race07 (obs de anticipación + recompensa de velocidad objetivo) subió el reward
# ~40% y bajó el Value Loss, pero seguía en ~10% de vuelta (offTrack 97%). Es
# hard-exploration: el agente no descubre la maniobra de curva porque el 97% de
# los intentos mueren en <2 s. race08 = imitación desde la heurística (que hace
# 82% de vuelta): BC pre-entrena la política y GAIL le da recompensa de imitación
# durante el entrenamiento. Requiere training/demos/*.demo — grabar con
# `eval.exe -record` (ver training/README.md §5). Ver docs/Devlog.md.

behaviors:
  RaceAgent:
    trainer_type: ppo

    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 1.0e-2
      beta_schedule: linear
      epsilon: 0.2
      epsilon_schedule: linear
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
      gail:
        gamma: 0.99
        strength: 0.15
        demo_path: training/demos
        use_actions: true

    # Behavioural cloning: pre-train + keep nudging the policy toward the
    # heuristic demos for the first ~2M steps, then it fades and RL takes over.
    behavioral_cloning:
      demo_path: training/demos
      strength: 0.5
      steps: 2000000

    keep_checkpoints: 20
    checkpoint_interval: 500000
    max_steps: 10000000
    time_horizon: 1000
    summary_freq: 50000
    threaded: false
