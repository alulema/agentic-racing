# Fase 2 — política del piloto (un solo agente).
# PPO, red MLP pequeña, observaciones vectoriales (raycasts + estado + canales de
# directiva). CPU-only: la GPU no aporta con este setup (CLAUDE.md §2.3).
#
#   mlagents-learn training/config/race_ppo.yaml `
#     --env=unity/Builds/train-windows/train.exe --num-envs=4 --run-id=race02
#
# El nombre "RaceAgent" tiene que coincidir con BehaviorParameters.BehaviorName
# (ver TrainingArena.AddBehaviour).
#
# race01 (2026-09-06): convergió a ~1.85M steps con Cumulative Reward ~3.4 y de
# ahí quedó plano 18M steps más — óptimo local de "avanzar despacio y seguro".
# iter 2: max_steps a 4M (converge mucho antes), beta más alto por exploración,
# y reward shaping de velocidad / trazada en RaceAgent.cs (docs/Devlog.md).

behaviors:
  RaceAgent:
    trainer_type: ppo

    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 1.0e-2
      beta_schedule: linear
      epsilon: 0.2
      epsilon_schedule: linear
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0

    keep_checkpoints: 20
    checkpoint_interval: 250000
    max_steps: 4000000
    time_horizon: 1000
    summary_freq: 50000
    threaded: false
