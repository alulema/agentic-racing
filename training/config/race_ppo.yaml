# Fase 2 — política del piloto (un solo agente).
# PPO, red MLP pequeña, observaciones vectoriales (raycasts + estado + canales de
# directiva). CPU-only: la GPU no aporta con este setup (CLAUDE.md §2.3).
#
#   mlagents-learn training/config/race_ppo.yaml `
#     --env=unity/Builds/train-windows/train.exe --num-envs=4 --run-id=race07
#
# El nombre "RaceAgent" tiene que coincidir con BehaviorParameters.BehaviorName
# (ver TrainingArena.AddBehaviour).
#
# race01-06 se estancaron en ~10% de vuelta; la heurística (misma física) hizo
# el 82%. Es brecha de aprendizaje, no del entorno: el agente no veía venir las
# curvas y la recompensa premiaba velocidad cruda. race07 (obliga a reentrenar,
# cambia el espacio de observación): +3 obs de curvatura hacia adelante
# (VectorObservationSize 12->15), raycasts 40->70 m, y la recompensa de velocidad
# ahora tiene pico en una velocidad OBJETIVO según la curvatura (frenar en curva
# paga). Ver docs/Devlog.md.

behaviors:
  RaceAgent:
    trainer_type: ppo

    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 1.0e-2
      beta_schedule: linear
      epsilon: 0.2
      epsilon_schedule: linear
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0

    keep_checkpoints: 20
    checkpoint_interval: 500000
    max_steps: 10000000
    time_horizon: 1000
    summary_freq: 50000
    threaded: false
