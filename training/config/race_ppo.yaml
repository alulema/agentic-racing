# Fase 2 — política del piloto (un solo agente).
# PPO, red MLP pequeña, observaciones vectoriales (raycasts + estado + canales de
# directiva). CPU-only: la GPU no aporta con este setup (CLAUDE.md §2.3).
#
#   mlagents-learn training/config/race_ppo.yaml `
#     --env=unity/Builds/train-windows/train.exe --num-envs=4 --run-id=race05
#
# El nombre "RaceAgent" tiene que coincidir con BehaviorParameters.BehaviorName
# (ver TrainingArena.AddBehaviour).
#
# race01-04: la política nunca aprendió a frenar (eval: meanBrake ~0.02); o
# reptaba a ~7 m/s (race03) o salía disparada y se estrellaba/paraba en ~200 m
# (race04) — ambas ~9% de vuelta. iter 5 (RaceAgent.cs): 'stuck' pasa a
# penalización por segundo (ya no termina el episodio como vía de escape) y el
# time-penalty plano se reemplaza por una penalización por ir lento. Ver Devlog.

behaviors:
  RaceAgent:
    trainer_type: ppo

    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 1.0e-2
      beta_schedule: linear
      epsilon: 0.2
      epsilon_schedule: linear
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0

    keep_checkpoints: 20
    checkpoint_interval: 500000
    max_steps: 6000000
    time_horizon: 1000
    summary_freq: 50000
    threaded: false
