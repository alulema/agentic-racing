name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/alulema/agentic-racing

jobs:
  build-webgl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-unity-WebGL-${{ hashFiles('unity/Assets/**', 'unity/Packages/**', 'unity/ProjectSettings/**') }}
          restore-keys: Library-unity-WebGL-

      # Requires the UNITY_LICENSE secret: a Personal license activated via
      # the .alf -> .ulf flow (CLAUDE.md sección 8, humano-only). See
      # https://game.ci/docs/github/activation for the activation steps.
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: 6000.3.22f1
          targetPlatform: WebGL
          buildsPath: unity-build-output

      - uses: actions/upload-artifact@v4
        with:
          name: webgl-build
          path: unity-build-output/WebGL
          retention-days: 1

  build-and-push-image:
    needs: build-webgl
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: webgl-build
          path: unity-build-output/WebGL

      # Merge the Unity output into /web, keeping our own index.html (the
      # DOM overlay shell) instead of Unity's auto-generated one.
      - name: Assemble /web static root
        run: |
          cp -r unity-build-output/WebGL/Build web/Build
          cp -r unity-build-output/WebGL/TemplateData web/TemplateData
          if [ -d unity-build-output/WebGL/StreamingAssets ]; then
            cp -r unity-build-output/WebGL/StreamingAssets web/StreamingAssets
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      # NOTE (humano, una sola vez): el paquete GHCR nace privado la primera
      # vez que se publica. Hay que ir a Package Settings en GitHub y
      # cambiar la visibilidad a Public — la infra efímera lo jala sin
      # credenciales (contrato DEMO_INTEGRATION.md, punto 7).
