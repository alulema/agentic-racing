<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agentic Racing</title>

  <!-- Contrato de integración: tema del sitio en vivo, con fallback si no carga -->
  <link rel="stylesheet" href="https://alexisalulema.com/demo-theme.css" />
  <style>
    :root {
      /* Fallback mínimo por si demo-theme.css no carga (contrato "Estilo/branding") */
      --color-bg: #0e0f12;
      --color-bg-card: #17181c;
      --color-border: #2a2c33;
      --color-text: #e8e9ec;
      --color-text-dim: #9aa0aa;
      --color-accent: #6ee7b7;
      --color-warning: #e0a34a;
      --color-error: #d05a5a;
      --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
      --radius: 8px;
    }
  </style>
  <link rel="stylesheet" href="style.css?v=7" />
</head>
<body>
  <div id="stage">
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="load-bar"></div>

      <div id="waiting">esperando inicio de carrera…</div>

      <div id="race-over"></div>

      <div id="llm-status">LLM ?</div>

      <div id="hud" style="visibility:hidden">
        <div class="hud-card" id="lap-card">LAP – / –</div>
        <div class="hud-card" id="standings">
          <table><tbody id="standings-body"></tbody></table>
        </div>
      </div>

      <div id="radio">
        <h2>Team radio <span id="radio-age"></span>
          <button id="trace-open" type="button" title="Decision log (Fase 6.1) — every strategist call, with the exact input it saw">log</button>
        </h2>
        <div id="radio-feed"></div>
      </div>

      <!-- Fase 6.1 traceability: click any radio line (or "log") to see the
           exact context/telemetry the strategist had and, for a live LLM
           call, ask it to re-explain the decision. -->
      <div id="trace-modal" hidden>
        <div id="trace-backdrop"></div>
        <div id="trace-panel" role="dialog" aria-label="Decision log">
          <div id="trace-head">
            <span id="trace-title">Decision log</span>
            <button id="trace-close" type="button" aria-label="Close">×</button>
          </div>
          <div id="trace-list"></div>
          <div id="trace-detail" hidden>
            <button id="trace-back" type="button">‹ back to log</button>
            <div id="trace-detail-body"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js?v=8"></script>

  <!-- "About this demo" panel (DEMO_INTEGRATION.md). Define DEMO_INFO first,
       then load the widget from the site origin. Purely additive. -->
  <script src="demo-info.js?v=6"></script>
  <script src="https://alexisalulema.com/demo-panel.js" defer></script>
</body>
</html>
