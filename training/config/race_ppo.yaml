# Fase 2 — política del piloto (un solo agente).
# PPO, red MLP pequeña, observaciones vectoriales (raycasts + estado + canales de
# directiva). CPU-only: la GPU no aporta con este setup (CLAUDE.md §2.3).
#
#   mlagents-learn training/config/race_ppo.yaml \
#     --env=Builds/train-linux/train.x86_64 --no-graphics \
#     --num-envs=4 --run-id=race01
#
# El nombre "RaceAgent" tiene que coincidir con BehaviorParameters.BehaviorName
# (ver TrainingArena.AddBehaviour).

behaviors:
  RaceAgent:
    trainer_type: ppo

    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      beta_schedule: linear
      epsilon: 0.2
      epsilon_schedule: linear
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0

    keep_checkpoints: 10
    checkpoint_interval: 500000
    max_steps: 20000000
    time_horizon: 1000
    summary_freq: 50000
    threaded: false
